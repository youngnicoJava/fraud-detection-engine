quarkus.application.name=fraud-detection-engine
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8083}
quarkus.http.limits.max-body-size=64K
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:5175}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-Correlation-ID
quarkus.http.cors.exposed-headers=X-Correlation-ID
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:fraud_app}
quarkus.datasource.password=${DB_PASSWORD:fraud_dev}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5435/fraud_detection}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.health.enabled=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=metrics
quarkus.otel.enabled=true
quarkus.otel.service.name=${OTEL_SERVICE_NAME:fraud-detection-engine}
quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORTER_OTLP_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.json.enabled=${JSON_LOGS:false}
quarkus.log.console.json.additional-field.service.value=fraud-detection-engine
quarkus.log.level=INFO
quarkus.smallrye-openapi.info-title=Fraud Detection Engine API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_CLIENT_ID:fraud-detection-api}
quarkus.oidc.roles.role-claim-path=realm_access/roles
%dev.quarkus.keycloak.devservices.enabled=true
%dev.quarkus.keycloak.devservices.port=8182
%dev.quarkus.keycloak.devservices.service-name=fraud-detection-keycloak
%dev.quarkus.keycloak.devservices.realm-path=keycloak/fraud-detection-realm.json
%dev.quarkus.observability.enabled=false
%test.quarkus.oidc.enabled=false
%test.quarkus.scheduler.enabled=false
%test.mp.messaging.incoming.fraud-assessment-requests.enabled=false
%test.mp.messaging.outgoing.fraud-assessment-results.enabled=false
%test.mp.messaging.outgoing.fraud-case-resolutions.enabled=false
%test.quarkus.otel.exporter.otlp.enabled=false
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.http.auth.permission.api.paths=/api/*
%prod.quarkus.http.auth.permission.api.policy=authenticated
%prod.quarkus.http.cors.origins=${FRONTEND_ORIGIN}
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID}
%prod.quarkus.log.console.json.enabled=true

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
fraud.kafka.enabled=${FRAUD_KAFKA_ENABLED:false}
mp.messaging.incoming.fraud-assessment-requests.connector=smallrye-kafka
mp.messaging.incoming.fraud-assessment-requests.topic=loan.fraud-assessment.requested.v1
mp.messaging.incoming.fraud-assessment-requests.group.id=fraud-detection-engine
mp.messaging.incoming.fraud-assessment-requests.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fraud-assessment-requests.auto.offset.reset=earliest
mp.messaging.incoming.fraud-assessment-requests.failure-strategy=dead-letter-queue
mp.messaging.incoming.fraud-assessment-requests.dead-letter-queue.topic=loan.fraud-assessment.requested.v1.DLQ
mp.messaging.incoming.fraud-assessment-requests.enabled=${FRAUD_KAFKA_ENABLED:false}
mp.messaging.outgoing.fraud-assessment-results.connector=smallrye-kafka
mp.messaging.outgoing.fraud-assessment-results.topic=fraud.assessment.completed.v1
mp.messaging.outgoing.fraud-assessment-results.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.fraud-assessment-results.enabled=${FRAUD_KAFKA_ENABLED:false}
mp.messaging.outgoing.fraud-case-resolutions.connector=smallrye-kafka
mp.messaging.outgoing.fraud-case-resolutions.topic=fraud.case.resolved.v1
mp.messaging.outgoing.fraud-case-resolutions.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.fraud-case-resolutions.enabled=${FRAUD_KAFKA_ENABLED:false}
mp.messaging.connector.smallrye-kafka.health-enabled=true
mp.messaging.connector.smallrye-kafka.health-topic-verification-enabled=true
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%prod.fraud.kafka.enabled=${FRAUD_KAFKA_ENABLED:true}
%prod.mp.messaging.incoming.fraud-assessment-requests.enabled=${FRAUD_KAFKA_ENABLED:true}
%prod.mp.messaging.outgoing.fraud-assessment-results.enabled=${FRAUD_KAFKA_ENABLED:true}
%prod.mp.messaging.outgoing.fraud-case-resolutions.enabled=${FRAUD_KAFKA_ENABLED:true}
